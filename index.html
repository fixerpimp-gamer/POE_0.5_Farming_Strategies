<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PoE2 Farming Strategies — 0.5</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a06;--bg2:#0f120c;--bg3:#161a12;--bg4:#1d2118;--border:#252b1e;--border2:#3a4230;--gold:#c9a84c;--gold2:#e8c86a;--gold3:#7a6428;--red:#b84040;--green:#4a8a4a;--text:#ccc8b4;--text2:#8a8470;--text3:#504c40;--panel:290px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;overflow:hidden;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border2);}
#topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--border2);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;position:relative;z-index:200;}
#menu-btn{width:36px;height:36px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;transition:all .2s;color:var(--text2);}
#menu-btn:hover,#menu-btn.open{background:var(--border2);color:var(--gold2);border-color:var(--gold3);}
#logo{width:28px;height:28px;background:linear-gradient(135deg,var(--gold),var(--red));display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;font-family:'Cinzel',serif;font-weight:900;color:var(--bg);}
#title-block{line-height:1.2;flex-shrink:0;}
#title-block .t1{font-size:11px;font-weight:700;color:var(--gold2);letter-spacing:2px;font-family:'Cinzel',serif;}
#title-block .t2{font-size:9px;color:var(--text3);letter-spacing:1px;}
#searchbox{flex:1;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:6px;height:32px;min-width:0;}
#searchbox input{background:none;border:none;outline:none;color:var(--text);font-family:'Crimson Pro',serif;font-size:14px;width:100%;}
#searchbox input::placeholder{color:var(--text3);}
#app{display:flex;height:calc(100vh - 52px);position:relative;}
#panel{width:var(--panel);height:100%;background:var(--bg2);border-right:1px solid var(--border2);display:flex;flex-direction:column;flex-shrink:0;transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:100;overflow:hidden;}
#panel-header{padding:12px 14px 8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.ph-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;}
.ph-count{font-size:12px;color:var(--text2);margin-top:2px;}
#filter-row{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.fchip{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1px;padding:3px 8px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;text-transform:uppercase;transition:all .15s;}
.fchip:hover,.fchip.on{border-color:var(--gold3);color:var(--gold2);background:var(--bg4);}
#strat-list{flex:1;overflow-y:auto;}
.strat-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative;}
.strat-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .15s;}
.strat-item:hover{background:var(--bg3);}
.strat-item.active{background:var(--bg4);}
.strat-item.active::before{background:var(--gold3);}
.si-badge{flex-shrink:0;width:34px;height:34px;border:1px solid var(--tier-col,var(--border2));display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:9px;font-weight:700;color:var(--tier-col,var(--text3));background:rgba(0,0,0,.4);}
.strat-item[data-tier="S"]{--tier-col:#e8c86a;}
.strat-item[data-tier="A+"]{--tier-col:#c9a84c;}
.strat-item[data-tier="A"]{--tier-col:#6a9a5a;}
.strat-item[data-tier="B+"]{--tier-col:#5a7a9a;}
.strat-item[data-tier="REQ"]{--tier-col:#b84040;}
.si-info{min-width:0;flex:1;}
.si-name{font-family:'Cinzel',serif;font-size:12px;color:var(--text);line-height:1.2;}
.si-meta{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.strat-item.hidden{display:none;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;}
#main{flex:1;overflow-y:auto;}
#detail{min-height:100%;display:flex;flex-direction:column;}
#detail-header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:18px 20px 14px;flex-shrink:0;}
.dh-top{display:flex;align-items:flex-start;gap:14px;}
.dh-badge{flex-shrink:0;width:48px;height:48px;border:1px solid var(--tier-col,var(--border2));display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:900;font-size:14px;color:var(--tier-col,var(--text3));}
.dh-info{flex:1;}
.dh-name{font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:var(--gold2);line-height:1.2;}
.dh-sub{font-size:13px;color:var(--text2);font-style:italic;margin-top:3px;}
.dh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);margin-top:14px;}
.dhs{background:var(--bg3);padding:8px 12px;text-align:center;}
.dhs-label{font-family:'Cinzel',serif;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);display:block;}
.dhs-val{font-size:13px;color:var(--text);font-weight:600;margin-top:2px;display:block;line-height:1.2;}
.dhs-val.g{color:var(--green)}.dhs-val.w{color:var(--gold)}.dhs-val.r{color:var(--red)}
.return-row{padding:10px 20px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.ret-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);flex-shrink:0;}
.ret-val{font-size:14px;color:var(--gold2);font-weight:600;}
.tab-bar{display:flex;border-bottom:1px solid var(--border2);overflow-x:auto;flex-shrink:0;background:var(--bg2);scrollbar-width:none;position:sticky;top:0;z-index:10;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:10px 16px;border-bottom:2px solid transparent;color:var(--text3);cursor:pointer;white-space:nowrap;transition:all .15s;background:none;border-left:none;border-right:none;border-top:none;}
.tab-btn:hover{color:var(--text2)}.tab-btn.on{color:var(--gold2);border-bottom-color:var(--gold3);}
.tab-panel{display:none;padding:18px 20px;}.tab-panel.on{display:block;}
.sec{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold3);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border);}
.sec:first-child{margin-top:0;}
.steps{list-style:none;}
.step{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:1.5;}
.step:last-child{border-bottom:none;}
.snum{flex-shrink:0;width:22px;height:22px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'Cinzel',serif;color:var(--gold3);margin-top:2px;}
.stxt{color:var(--text);}
.bullets{list-style:none;}
.bullet{padding:4px 0 4px 14px;position:relative;font-size:14px;color:var(--text);line-height:1.4;}
.bullet::before{content:'◆';position:absolute;left:0;color:var(--gold3);font-size:7px;top:8px;}
.bullet.r::before{color:var(--red);}
.kv{display:flex;flex-direction:column;gap:1px;background:var(--border);margin:6px 0;}
.kvr{display:grid;grid-template-columns:110px 1fr;background:var(--bg3);}
.kvk{padding:7px 10px;font-size:11px;color:var(--text3);font-family:'Cinzel',serif;border-right:1px solid var(--border);display:flex;align-items:center;line-height:1.3;}
.kvv{padding:7px 10px;font-size:13px;color:var(--text);line-height:1.4;}
.kvv.g{color:var(--green)}.kvv.w{color:var(--gold2)}.kvv.r{color:var(--red)}
.alert{border:1px solid var(--border2);padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.5;}
.alert.w{background:rgba(201,168,76,.07);border-color:rgba(201,168,76,.25);}
.alert.r{background:rgba(184,64,64,.07);border-color:rgba(184,64,64,.25);}
.alert-lbl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:4px;}
.alert.w .alert-lbl{color:var(--gold3)}.alert.r .alert-lbl{color:var(--red)}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);margin:6px 0;}
.drop{background:var(--bg3);padding:8px 10px;}
.dn{font-size:12px;color:var(--text2);line-height:1.3;}
.dv{font-size:14px;color:var(--gold2);font-weight:600;margin-top:2px;}
.trow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.trow:last-child{border-bottom:none;}
.tslot{flex-shrink:0;background:var(--border2);color:var(--gold3);font-family:'Cinzel',serif;font-size:8px;padding:3px 6px;letter-spacing:1px;margin-top:2px;}
.tinfo .tn{font-size:13px;color:var(--text);line-height:1.3;}
.tinfo .tm{font-size:12px;color:var(--text2);font-style:italic;margin-top:2px;}
.variant{background:var(--bg);border:1px solid var(--border);padding:12px;margin-bottom:8px;}
.vname{font-family:'Cinzel',serif;font-size:11px;color:var(--gold2);letter-spacing:1px;margin-bottom:6px;}
#empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);text-align:center;padding:40px;}
#empty .e-icon{font-size:48px;margin-bottom:16px;opacity:.4;}
#empty .e-title{font-family:'Cinzel',serif;font-size:14px;color:var(--text2);letter-spacing:2px;}
#empty .e-sub{font-size:13px;margin-top:6px;font-style:italic;}
@media(max-width:680px){
  #panel{position:fixed;left:0;top:52px;bottom:0;transform:translateX(-100%);z-index:150;--panel:min(85vw,290px);width:var(--panel);}
  #panel.open{transform:translateX(0);}
  #overlay.show{display:block;}
  #main{width:100%;}
  .dh-name{font-size:16px;}
}
@media(min-width:681px){
  #panel{transform:translateX(0)!important;}
  #panel.closed{transform:translateX(calc(-1 * var(--panel)))!important;margin-right:calc(-1 * var(--panel));}
}
</style>
</head>
<body>
<div id="topbar">
  <div id="menu-btn" onclick="togglePanel()">☰</div>
  <div id="logo">⚔</div>
  <div id="title-block"><div class="t1">Farming Strategies</div><div class="t2">PoE2 · 0.5 Return of the Ancients</div></div>
  <div id="searchbox"><span style="color:var(--text3);font-size:13px">🔍</span><input type="text" id="search" placeholder="Search…" oninput="doSearch(this.value)"></div>
</div>
<div id="app">
  <div id="overlay" onclick="closePanel()"></div>
  <div id="panel">
    <div id="panel-header"><div class="ph-title">Strategies</div><div class="ph-count" id="count-label">11 strategies</div></div>
    <div id="filter-row">
      <div class="fchip on" onclick="setFilter('all',this)">All</div>
      <div class="fchip" onclick="setFilter('S',this)">S Tier</div>
      <div class="fchip" onclick="setFilter('A',this)">A Tier</div>
      <div class="fchip" onclick="setFilter('league',this)">League</div>
      <div class="fchip" onclick="setFilter('meta',this)">Meta</div>
    </div>
    <div id="strat-list"></div>
  </div>
  <div id="main"><div id="detail"><div id="empty"><div class="e-icon">⚔</div><div class="e-title">Select a Strategy</div><div class="e-sub">Choose from the panel to view details</div></div></div></div>
</div>
<script>
const STRATS=[
{id:'strat_006',tier:'REQ',type:'meta',name:'Atlas Progression',sub:'Meta / Prerequisite — Do This First',ret:'Complete before farming any mechanic',
stats:[{l:'Points',v:'335 Total',c:'w'},{l:'Investment',v:'Time Only'},{l:'Difficulty',v:'Easy–Med'}],
tabs:[{label:'Quest Line',id:'p-quest'},{label:'Fast Method',id:'p-fast'},{label:'Atlas Tree',id:'p-tree'},{label:'Masters',id:'p-masters'},{label:'Tips',id:'p-tips'}],
panels:{'p-quest':`
<div class="alert r"><span class="alert-lbl">⚠ Critical Rule</span>Atlas points ONLY earned inside the Fortress. Outside maps = ZERO atlas tree points.</div>
<div class="sec">Quest Steps</div>
<ul class="steps">
<li class="step"><div class="snum">1</div><div class="stxt">Ziggurat Refuge → Clear Precursor Tower → Fortress rises</div></li>
<li class="step"><div class="snum">2</div><div class="stxt">Follow quest → Burning Monolith. Don't grind side nodes.</div></li>
<li class="step"><div class="snum">3</div><div class="stxt">Western + Eastern Gateway (T10+) → 3 pts each → enigma fragments</div></li>
<li class="step"><div class="snum">4</div><div class="stxt"><strong>Arbiter of Ash ⚔</strong> — Touch beacon in boss arena (easy to miss!)</div></li>
<li class="step"><div class="snum">5</div><div class="stxt">Origin Tower → Patriarch + Matriarch Halls (T15, 7pts each) → Origin Core</div></li>
<li class="step"><div class="snum">6</div><div class="stxt"><strong>Arbiter of Divinity ⚔</strong> → Section Clear (~40–50 pts per kill × 5)</div></li>
</ul>
<div class="sec">Arbiter Fragments</div>
<div class="kv">
<div class="kvr"><div class="kvk">Ash (3 frags)</div><div class="kvv">Ancient + Faded + Weathered Crisis → Burning Monolith wall</div></div>
<div class="kvr"><div class="kvk">Divinity (2 frags)</div><div class="kvv">Origin Cradle + Origin Spark → Doriani → Origin Core. Or buy from exchange.</div></div>
<div class="kvr"><div class="kvk">Sources</div><div class="kvv w">Citadels (colored beams on Atlas) or Currency Exchange</div></div>
</div>`,
'p-fast':`
<div class="alert w"><span class="alert-lbl">⚡ Fast Method</span>Each Arbiter of Divinity kill → choose 1 of 5 fortress sections → ALL nodes complete instantly (~40–50 pts)</div>
<div class="sec">Finding Halls Outside</div>
<ul class="bullets">
<li class="bullet"><strong>Free:</strong> Clear outskirt towers → path to square buildings with light</li>
<li class="bullet"><strong>Fast:</strong> Grand Project tablet on tower → area freely traversable. Use 2× together.</li>
<li class="bullet"><strong>Speedrun:</strong> Level 1 maps — boss only, 20–30 sec. Halls need ~T10–11.</li>
</ul>
<div class="sec">Tier → Level</div>
<div class="kv">
<div class="kvr"><div class="kvk">T6 ⚡</div><div class="kvv w">Level 70 — unlocks irradiated tablets</div></div>
<div class="kvr"><div class="kvk">T11 ⚡</div><div class="kvv w">Level 75+ — fracturing orbs, exceptional items, major nodes</div></div>
<div class="kvr"><div class="kvk">T16</div><div class="kvv">Level 80 (max)</div></div>
</div>`,
'p-tree':`
<div class="sec">First Priority — Waystone Sustain</div>
<ul class="bullets">
<li class="bullet">Search "waystones" in Atlas tree → grab Rogue Exile drops + map boss quantity nodes</li>
</ul>
<div class="sec">New / Returning Players</div>
<ul class="steps">
<li class="step"><div class="snum">1</div><div class="stxt">Shrine cluster + magic monster boost nodes</div></li>
<li class="step"><div class="snum">2</div><div class="stxt">Eons of Contamination (T6) → Evolving Throngs</div></li>
<li class="step"><div class="snum">3</div><div class="stxt">No Simple Battles → Valuable Paths → Specialized Seeker</div></li>
<li class="step"><div class="snum">4</div><div class="stxt">Chosen Path (Rogue Exiles) → Journey Ahead (Effectiveness)</div></li>
</ul>
<div class="sec">Experienced Players</div>
<ul class="steps">
<li class="step"><div class="snum">1</div><div class="stxt">Rush T6 → Eons of Contamination + A Top the World</div></li>
<li class="step"><div class="snum">2</div><div class="stxt">Rush T11 → Curious Durable Stone + Partial Translation</div></li>
<li class="step"><div class="snum">3</div><div class="stxt">Hidden Scars (fracturing orbs) + exceptional item nodes</div></li>
</ul>
<div class="sec">Most Important Late Node</div>
<div class="kv"><div class="kvr"><div class="kvk">Tablets Upgrade</div><div class="kvv w">Tablets become Rare with +1 max modifier (4 mods total)</div></div></div>
<div class="alert r"><span class="alert-lbl">⚠ No Refunds</span>Points cannot be refunded. Multi-choice nodes CAN be changed freely.</div>`,
'p-masters':`
<div class="sec">Hilda — Best for Abyss</div>
<div class="kv">
<div class="kvr"><div class="kvk">Location</div><div class="kvv">Near Ziggurat Refuge (Hilda's Campsite)</div></div>
<div class="kvr"><div class="kvk">Key bonus</div><div class="kvv">Each different tablet type = +25% explicit effects. 2 types = +50% total.</div></div>
<div class="kvr"><div class="kvk">⚠ Bug</div><div class="kvv r">Ancient Inscriptions BUGGED in 0.5</div></div>
</div>
<div class="sec">Duriani — Best for Breach + Boss Rushing</div>
<div class="kv">
<div class="kvr"><div class="kvk">Location</div><div class="kvv">Clear a Corrupted Nexus (red area on Atlas)</div></div>
<div class="kvr"><div class="kvk">Key bonus</div><div class="kvv">Rare monster juice + desert/mountain biomes + free irradiated (fixed)</div></div>
</div>
<div class="sec">Jado ★ Best for Ritual / Expedition / Lineage Gems</div>
<div class="kv">
<div class="kvr"><div class="kvk">Location</div><div class="kvv">Sealed Vault — SW of fortress, west of ritual zone. No quest marker.</div></div>
<div class="kvr"><div class="kvk">Key bonus</div><div class="kvv w">20% chance to double explicit AND implicit tablet modifiers</div></div>
<div class="kvr"><div class="kvk">Untold Histories</div><div class="kvv w">35% increased lineage support gem chance — key for anomaly map hunting</div></div>
</div>`,
'p-tips':`
<div class="sec">Easy-to-Miss Tips</div>
<ul class="bullets">
<li class="bullet">Touch the <strong>beacon in every map</strong> — NOT just clearing. Can be in boss arena.</li>
<li class="bullet">Outward towers have <strong>two bosses simultaneously</strong></li>
<li class="bullet"><strong>Site of Chosen</strong> — on way to Halls, free passive point</li>
<li class="bullet">Arbiter of Ash Diamond drop — ALWAYS identify before selling (up to 25 div vs 2 div raw)</li>
</ul>
<div class="sec">Mechanic Zone Unlocks</div>
<div class="kv">
<div class="kvr"><div class="kvk">Breach (T14)</div><div class="kvv">Genesis Tree + Hive Mine</div></div>
<div class="kvr"><div class="kvk">Delirium</div><div class="kvv">5 maps + bosses → Instilling Tree (amulet anointments)</div></div>
</div>`
}},
{id:'strat_007',tier:'S',type:'league',name:'Breach',sub:'Unstable Breach + Genesis Tree — Fubgun',ret:'50+ div/hr raw · 70–80 div/hr with Genesis Tree crafted items',
stats:[{l:'Return',v:'50–80 div/hr',c:'g'},{l:'Consistency',v:'High',c:'g'},{l:'Difficulty',v:'Easy–Med'}],
tabs:[{label:'Core Loop',id:'b-loop'},{label:'Tablets',id:'b-tabs'},{label:'Genesis Tree',id:'b-gen'},{label:'Budget',id:'b-bud'}],
panels:{'b-loop':`
<div class="alert w"><span class="alert-lbl">⚡ The Math</span>3× tablets (+3 rares each) + 1× unique (+5 rares) = up to 14 extra rares per breach × 4 breaches = massive loot. Jado proc (~1/5 maps): doubles everything.</div>
<div class="sec">Setup</div>
<div class="kv">
<div class="kvr"><div class="kvk">Maps</div><div class="kvv">City biome (4 tablet slots). T15, 6–8 mods, high item rarity + monster effectiveness. Use Grand Mirror for 200% Delirium.</div></div>
<div class="kvr"><div class="kvk">Master</div><div class="kvv w">Jado — Partial Translations + Unforeseen Threats + Unexpected Mission</div></div>
<div class="kvr"><div class="kvk">Biomes</div><div class="kvv">Desert (best rares) → Mountain (tablets). Duriani makes them spawn more.</div></div>
</div>
<div class="sec">Core Loop</div>
<ul class="steps">
<li class="step"><div class="snum">1</div><div class="stxt">Target city biome in Desert/Mountain area → run unstable breaches every map</div></li>
<li class="step"><div class="snum">2</div><div class="stxt">Kill rare monsters at breach end → loot explosion + Hive Blood</div></li>
<li class="step"><div class="snum">3</div><div class="stxt">Collect tablets from Mountain biomes (~5 div/20 maps passively)</div></li>
<li class="step"><div class="snum">4</div><div class="stxt">Travel to Monastery of the Keepers → spend Hive Blood on Genesis Tree</div></li>
<li class="step"><div class="snum">5</div><div class="stxt">Sell catalysts + crafted belts/rings/amulets</div></li>
</ul>`,
'b-tabs':`
<div class="trow"><div class="tslot">×3</div><div class="tinfo"><div class="tn">Breach tablets — unstable breaches spawn 3 additional rare monsters when stabilized</div><div class="tm">Rolls 1–3. Divine yourself if cheaper than buying 3-roll.</div></div></div>
<div class="trow"><div class="tslot">×1 UNIQUE</div><div class="tinfo"><div class="tn">Unique Breach tablet — 5 additional rare monsters</div><div class="tm">Prefer NO negative pack size on this tablet.</div></div></div>
<div class="sec">Secondary Mods — Get 2 of 3 (if only 1, choose #1)</div>
<div class="kv">
<div class="kvr"><div class="kvk">Mod 1 ★</div><div class="kvv w">Monsters 10–15% increased Effectiveness</div></div>
<div class="kvr"><div class="kvk">Mod 2</div><div class="kvv">Rare Breach Monsters 5–20% increased Effectiveness</div></div>
<div class="kvr"><div class="kvk">Mod 3</div><div class="kvv">Items 8–12% increased Rarity in Map</div></div>

let current=null,filterMode='all',searchQ='';
const tierCols={S:'#e8c86a','A+':'#c9a84c',A:'#6a9a5a','B+':'#5a7a9a',REQ:'#b84040'};

function buildList(){
  const list=document.getElementById('strat-list');
  list.innerHTML=STRATS.map(s=>`<div class="strat-item${current===s.id?' active':''}" data-id="${s.id}" data-tier="${s.tier}" data-type="${s.type}" onclick="select('${s.id}')"><div class="si-badge">${s.tier}</div><div class="si-info"><div class="si-name">${s.name}</div><div class="si-meta">${s.sub}</div></div></div>`).join('');
  applyFilters();
}

function applyFilters(){
  let vis=0;
  document.querySelectorAll('.strat-item').forEach(item=>{
    const s=STRATS.find(x=>x.id===item.dataset.id);
    const mf=filterMode==='all'||(filterMode==='S'&&s.tier==='S')||(filterMode==='A'&&(s.tier==='A'||s.tier==='A+'))||(filterMode==='league'&&s.type==='league')||(filterMode==='meta'&&s.type==='meta');
    const ms=!searchQ||s.name.toLowerCase().includes(searchQ)||s.sub.toLowerCase().includes(searchQ);
    item.classList.toggle('hidden',!(mf&&ms));
    if(mf&&ms)vis++;
  });
  document.getElementById('count-label').textContent=vis+' strateg'+(vis===1?'y':'ies');
}

function setFilter(f,el){filterMode=f;document.querySelectorAll('.fchip').forEach(c=>c.classList.remove('on'));el.classList.add('on');applyFilters();}
function doSearch(v){searchQ=v.toLowerCase().trim();applyFilters();}

function select(id){
  current=id;
  const s=STRATS.find(x=>x.id===id);
  document.querySelectorAll('.strat-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  const tc=tierCols[s.tier]||'#7a6428';
  const statsHtml=s.stats.map(st=>`<div class="dhs"><span class="dhs-label">${st.l}</span><span class="dhs-val ${st.c||''}">${st.v}</span></div>`).join('');
  const tabBtns=s.tabs.map((t,i)=>`<button class="tab-btn${i===0?' on':''}" onclick="switchTab(this,'${t.id}')">${t.label}</button>`).join('');
  const tabPanels=s.tabs.map((t,i)=>`<div class="tab-panel${i===0?' on':''}" id="${t.id}">${s.panels[t.id]||''}</div>`).join('');
  document.getElementById('detail').innerHTML=`
<div id="detail-header">
  <div class="dh-top"><div class="dh-badge" style="--tier-col:${tc}">${s.tier}</div><div class="dh-info"><div class="dh-name">${s.name}</div><div class="dh-sub">${s.sub}</div></div></div>
  <div class="dh-stats">${statsHtml}</div>
</div>
<div class="return-row"><span class="ret-label">Return</span><span class="ret-val">${s.ret}</span></div>
<div class="tab-bar">${tabBtns}</div>
<div>${tabPanels}</div>`;
  if(window.innerWidth<=680)closePanel();
  document.getElementById('main').scrollTop=0;
}

function switchTab(btn,panelId){
  const d=document.getElementById('detail');
  d.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  d.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById(panelId).classList.add('on');
}

function togglePanel(){
  const p=document.getElementById('panel'),btn=document.getElementById('menu-btn'),ov=document.getElementById('overlay');
  if(window.innerWidth<=680){const open=p.classList.toggle('open');btn.classList.toggle('open',open);ov.classList.toggle('show',open);}
  else{const closed=p.classList.toggle('closed');btn.classList.toggle('open',!closed);}
}
function closePanel(){document.getElementById('panel').classList.remove('open');document.getElementById('menu-btn').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
